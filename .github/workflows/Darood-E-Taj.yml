name: Darood E Taj 

on:
  workflow_dispatch:

jobs:
  stream_part_1:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Stream Part 1 (≈6h)
        run: |
          ffmpeg -re -stream_loop -1 -i video_24mb.mp4 \
          -c:v libx264 -preset veryfast -pix_fmt yuv420p \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv \
          "rtmp://a.rtmp.youtube.com/live2/${{ secrets.STREAM_KEY }}" &
          sleep 21000
          kill $! 

  stream_part_2:
    needs: stream_part_1
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Stream Part 2 (≈6h)
        run: |
          ffmpeg -re -stream_loop -1 -i video_24mb.mp4 \
          -c:v libx264 -preset veryfast -pix_fmt yuv420p \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv \
          "rtmp://a.rtmp.youtube.com/live2/${{ secrets. STREAM_KEY }}"
